name: "Deploy Prod (Manual)"
run-name: "Deploy Prod (Manual) — ${{ github.event.inputs.image }}"

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image to deploy (copy from dev deploy run output)"
        required: true
        type: string

concurrency:
  group: deploy-prod-manual
  cancel-in-progress: false

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Deploy to prod
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: prod-gcp
          RESOURCE: .nais/nais-prod.yaml
          VAR: image=${{ github.event.inputs.image }}
