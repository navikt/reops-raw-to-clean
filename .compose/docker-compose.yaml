services:
  # -- Kafka controller (KRaft mode) --
  controller-1:
    image: docker.io/apache/kafka:4.1.1
    container_name: kafka-controller-1
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    environment:
      KAFKA_CLUSTER_ID: "01916ec2-824f-77b4-a3c2-c1ccfd480450"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@controller-1:9093"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx384m"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-cluster.sh", "list-endpoints", "--bootstrap-controller", "controller-1:9093"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s
    volumes:
      - ./kafka/controller-1:/tmp/kafka-logs
    cpus: 0.5
    mem_limit: 768m

  # -- Kafka broker --
  broker-1:
    image: docker.io/apache/kafka:4.1.1
    container_name: kafka-broker-1
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    depends_on:
      - controller-1
    environment:
      KAFKA_CLUSTER_ID: "01916ec2-824f-77b4-a3c2-c1ccfd480450"
      KAFKA_NODE_ID: "2"
      KAFKA_PROCESS_ROLES: broker

      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker-1:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@controller-1:9093"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_HEAP_OPTS: "-Xms1g -Xmx1g"

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_MIN_SESSION_TIMEOUT_MS: "6000"
      KAFKA_GROUP_MAX_SESSION_TIMEOUT_MS: "300000"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "3000"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--list", "--bootstrap-server", "broker-1:9092"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    volumes:
      - ./kafka/broker-1:/tmp/kafka-logs
    ports:
      - "9092:9092"   # internal (container-to-container)
      - "9094:9094"   # external (host access — matches application-local.yaml)
    cpus: 0.5
    mem_limit: 2g

  # -- Kafka UI --
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.4.2
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      broker-1:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: "kafka-cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "broker-1:9092"
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "127.0.0.1:18950:8080"
    cpus: 0.5
    mem_limit: 512m
